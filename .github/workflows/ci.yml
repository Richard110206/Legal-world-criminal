name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-quality:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          pip install pytest pytest-timeout httpx ruff

      - name: Ruff lint
        run: python -m ruff check src ws_server.py

      - name: Module import smoke (app assembly)
        run: python -X utf8 -c "import ws_server; assert len(ws_server.app.openapi()['paths']) >= 50"

      - name: Pytest (offline teaching suite)
        env:
          SIMLAW_NLI_MODEL_DISABLED: "1"
        run: python -m pytest -q --timeout=120

      - name: Criminal flow verification (FSM + manifest + teaching)
        run: python -X utf8 scripts/verify_criminal.py

  frontend-quality:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (vue-tsc)
        run: node_modules/.bin/vue-tsc --noEmit -p tsconfig.json

      - name: Production build
        run: node_modules/.bin/vite build
