# ═══════════════════════════════════════════════════════════════
# 刑法适配 — 阶段工具分配清单（纯刑事）
# 只保留刑事阶段 (INV/PR/DS/CR/CRA) 与委托洽谈 (LC)。
#
# 设计原则：
#   agent_type_defaults = 常驻通用工具（记忆/检索/案件读取），任何阶段都具备
#   stages.*.role_tools = 阶段专属工具（起草/校验/差异化检索），场景进入注入、退出清理
#   分阶段匹配依据：每个阶段各角色的任务需求（会见/阅卷/起草/质证/宣判等）
# ═══════════════════════════════════════════════════════════════

version: 2
tool_registry_refs:
  # ── 通用工具 ──────────────────────────────────────────────
  - search_laws
  - save_client_memory
  - save_lawyer_memory
  - load_client_memory
  - load_lawyer_memory
  - read_case_artifact
  - search_cases
  - check_citations
  - compare_documents
  # ── 元典法条/案例检索（教学溯源）────────────────────────
  - search_yuandian_law
  - search_yuandian_law_detail
  - search_yuandian_case
  # ── 刑事工具 ─────────────────────────────────────────────
  - draft_indictment_document
  - draft_defense_opinion_document
  - draft_public_prosecution_document
  - draft_first_instance_criminal_judgment_document
  - draft_second_instance_criminal_judgment_document

# 常驻工具：任何阶段该角色都具备（记忆读写 + 法条/案例检索 + 案件产物读取）
agent_type_defaults:
  lawyer:
    - search_laws
    - search_yuandian_law
    - search_yuandian_law_detail
    - search_yuandian_case
    - search_cases
    - load_lawyer_memory
    - save_lawyer_memory
    - read_case_artifact
  client:
    - load_client_memory
    - save_client_memory
  judge:
    - search_laws
    - search_yuandian_law
    - search_yuandian_law_detail
    - load_lawyer_memory
    - save_lawyer_memory
  prosecutor:
    - search_laws
    - search_yuandian_law
    - search_yuandian_law_detail
    - load_lawyer_memory
    - save_lawyer_memory
  receptionist: []

stages:
  # ── LC 委托洽谈：律师谈罪名、查构成要件，当事人陈述 ──
  LC:
    shared_tools: []
    role_tools:
      client: []
      lawyer: []

  # ── INV 侦查阶段: 律师会见 + 了解罪名 + 申请取保候审 ──
  INV:
    shared_tools: []
    role_tools:
      lawyer: []
      client: []
      investigator: []

  # ── PR 审查起诉阶段: 阅卷 + 听取意见 + 决定是否起诉 ──
  PR:
    shared_tools: []
    role_tools:
      lawyer: []
      prosecutor:
        - draft_indictment_document
      defendant: []

  # ── DS 辩护词起草阶段: 律师起草《辩护词》+ 引用校验 ──
  DS:
    shared_tools: []
    role_tools:
      lawyer:
        - draft_defense_opinion_document
        - check_citations
        - compare_documents
      client: []
      defendant: []

  # ── CR 刑事一审庭审 ──
  CR:
    shared_tools: []
    role_tools:
      judge:
        - draft_first_instance_criminal_judgment_document
      prosecutor:
        - draft_public_prosecution_document
      client: []
      defendant: []
      defense_lawyer: []

  # ── CRA 刑事二审庭审 ──
  CRA:
    shared_tools: []
    role_tools:
      judge:
        - draft_second_instance_criminal_judgment_document
      prosecutor: []
      client: []
      appellant: []
      appellant_lawyer: []
      defense_lawyer: []
